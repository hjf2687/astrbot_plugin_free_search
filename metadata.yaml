name: 免费联网搜索
display_name: 免费联网搜索
desc: 给 LLM 注册 web_search 搜索与 web_read 读网页两个工具（默认 Bing/DuckDuckGo 免费抓取，可选配 Tavily API），AI 自动联网搜索、按需读取网页全文并以口语转述；支持 /搜索 关键词 手动触发
help: |
  免费联网搜索插件 —— 默认引擎无需任何 API Key。

  功能：
  1. AI 自动搜索：注册了 web_search 工具，AI 聊天时遇到需要实时信息的问题会自动调用，
     并用自然口语转述搜索结果（不会机械罗列链接）。
  2. 手动搜索：发送「/搜索 关键词」触发，结果同样由 AI 转述。
  3. 网页阅读：注册了 web_read 工具，AI 可以打开链接读取正文
     （比如用户分享的文章、搜索结果中需要展开的来源）。

  引擎说明：
  - tavily：Tavily 官方 API，结果质量最好；需在插件配置里填入 tavily_api_key
    （app.tavily.com 免费注册，每月 1000 次免费额度）；tavily_depth 可选
    advanced（质量更好，消耗 2 倍额度）
  - bing：必应网页抓取，国内可直连，最稳定（参考 dsh-free-search 的结论）
  - ddg：DuckDuckGo HTML，需要网络可达（国内裸连不通，有代理时可用）
  - auto（默认）：配了 tavily 密钥时先 Tavily、失败回退 Bing → DuckDuckGo；
    未配密钥则先 Bing、失败回退 DuckDuckGo

  注意：需要在 AstrBot 管理面板中重启/重载插件后生效。
  抓取的是搜索引擎网页，若站点改版导致解析失败，请更新插件或切换引擎。
